name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish artifacts to the selected release tag after all gates pass'
        required: true
        type: boolean
        default: false
      rescue_only:
        description: 'Run only the lightweight Windows rescue-collector validation'
        required: true
        type: boolean
        default: false
      mac_only:
        description: 'Run only the signed macOS build for signing diagnostics'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-windows-rescue:
    name: Windows rescue collector smoke test
    if: github.event_name == 'workflow_dispatch' && inputs.rescue_only
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run collector
        shell: pwsh
        run: |
          ./scripts/tester-rescue.ps1 -OutputDirectory "$env:RUNNER_TEMP"
          $bundle = Get-ChildItem "$env:RUNNER_TEMP/AI-Chief-of-Staff-rescue-*.zip" | Select-Object -First 1
          if (-not $bundle -or $bundle.Length -eq 0) { throw 'Rescue collector bundle is missing or empty.' }
          Write-Host "Verified $($bundle.Name) ($($bundle.Length) bytes)"

  build-mac:
    name: macOS signed build
    if: github.event_name != 'workflow_dispatch' || !inputs.rescue_only
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"

      - name: Install locked dependencies
        run: npm ci

      - name: Run release gates
        run: |
          npm run typecheck
          npm run lint
          npm test -- --maxWorkers=1
          node scripts/check-native.cjs

      - name: Import Apple signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_P12"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 5400 build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Store Apple notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          xcrun notarytool store-credentials AC_PASSWORD \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --validate

      - name: Build, sign, notarize, and verify native modules
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ACOS_GOOGLE_CLIENT_ID: ${{ secrets.ACOS_GOOGLE_CLIENT_ID }}
          ACOS_GOOGLE_CLIENT_SECRET: ${{ secrets.ACOS_GOOGLE_CLIENT_SECRET }}
          BUILD_KIND: release
        shell: bash
        run: |
          npm run build
          npx electron-builder --mac --arm64 --x64 -p never 2>&1 | tee "$RUNNER_TEMP/package-mac.log"
          grep -q '\[verify-native-modules\] OK' "$RUNNER_TEMP/package-mac.log"
          for app in release/mac*/AI\ Chief\ of\ Staff.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
          done
          for dmg in release/AI-Chief-of-Staff-*.dmg; do
            xcrun stapler validate "$dmg"
          done

      - name: Create macOS checksums
        shell: bash
        run: |
          cd release
          shasum -a 256 AI-Chief-of-Staff-*.dmg AI-Chief-of-Staff-*.zip > SHA256SUMS-macos.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ai-chief-of-staff-macos-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            release/AI-Chief-of-Staff-*.dmg
            release/AI-Chief-of-Staff-*.zip
            release/latest-mac.yml
            release/SHA256SUMS-macos.txt

  build-win-x64:
    name: Windows x64 native build
    if: github.event_name != 'workflow_dispatch' || (!inputs.rescue_only && !inputs.mac_only)
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag/package mismatch" }

      - name: Install locked dependencies
        run: npm ci

      - name: Run release gates and native SQLite load
        shell: bash
        run: |
          npm run typecheck
          npm run lint
          npm test -- --maxWorkers=1
          node scripts/check-native.cjs
          node -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.prepare('select 1').get(); db.close()"

      - name: Sign in to Azure with GitHub OIDC
        uses: Azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build, sign, and verify Windows x64
        env:
          ACOS_GOOGLE_CLIENT_ID: ${{ secrets.ACOS_GOOGLE_CLIENT_ID }}
          ACOS_GOOGLE_CLIENT_SECRET: ${{ secrets.ACOS_GOOGLE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          BUILD_KIND: release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:TRUSTED_SIGNING_ENDPOINT -or -not $env:TRUSTED_SIGNING_ACCOUNT -or -not $env:TRUSTED_SIGNING_PROFILE) {
            throw 'Azure Artifact Signing configuration is incomplete.'
          }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Application build failed with exit code $LASTEXITCODE." }
          npx electron-builder --win --x64 -p never `
            --config.win.azureSignOptions.endpoint="$env:TRUSTED_SIGNING_ENDPOINT" `
            --config.win.azureSignOptions.certificateProfileName="$env:TRUSTED_SIGNING_PROFILE" `
            --config.win.azureSignOptions.codeSigningAccountName="$env:TRUSTED_SIGNING_ACCOUNT" `
            --config.win.azureSignOptions.publisherName="Brett Lechtenberg" `
            2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/package-win.log"
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed with exit code $LASTEXITCODE." }
          if (-not (Select-String -Quiet -Path "$env:RUNNER_TEMP/package-win.log" -Pattern '\[verify-native-modules\] OK')) {
            throw 'Native-module afterPack verification did not run.'
          }
          $installer = Get-ChildItem release/AI-Chief-of-Staff-*-x64-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'x64 installer was not produced.' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Invalid Windows signature: $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -notmatch 'CN=Brett Lechtenberg(?:,|$)') {
            throw "Unexpected Windows signer: $($signature.SignerCertificate.Subject)"
          }
          'valid' | Set-Content -Encoding ascii release/WINDOWS-SIGNING-STATUS.txt

      - name: Verify tester rescue collector on Windows runner
        shell: pwsh
        run: |
          ./scripts/tester-rescue.ps1 -OutputDirectory "$env:RUNNER_TEMP"
          if (-not (Get-ChildItem "$env:RUNNER_TEMP/AI-Chief-of-Staff-rescue-*.zip")) {
            throw 'Windows rescue collector did not produce a bundle.'
          }

      - name: Create Windows checksums
        shell: pwsh
        run: |
          Copy-Item scripts/tester-rescue.ps1 release/tester-rescue.ps1
          $files = Get-ChildItem release/AI-Chief-of-Staff-*-x64-setup.exe, release/AI-Chief-of-Staff-*-x64-win.zip, release/tester-rescue.ps1
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii release/SHA256SUMS-windows-x64.txt

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ai-chief-of-staff-windows-x64-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            release/AI-Chief-of-Staff-*-x64-setup.exe
            release/AI-Chief-of-Staff-*-x64-win.zip
            release/latest.yml
            release/SHA256SUMS-windows-x64.txt
            release/WINDOWS-SIGNING-STATUS.txt
            release/tester-rescue.ps1

  publish-prerelease:
    name: Manual prerelease publication
    needs: [build-mac, build-win-x64]
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish &&
      startsWith(github.ref, 'refs/tags/')
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ai-chief-of-staff-macos-${{ github.ref_name }}
          path: release

      - name: Download Windows x64 artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ai-chief-of-staff-windows-x64-${{ github.ref_name }}
          path: release

      - name: Verify downloaded checksums and Windows signing gate
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS-macos.txt
          sha256sum --check SHA256SUMS-windows-x64.txt
          grep -qx 'valid' WINDOWS-SIGNING-STATUS.txt || {
            echo 'Publication blocked: Windows installer lacks a valid production signature.' >&2
            exit 1
          }

      - name: Publish verified prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            release/AI-Chief-of-Staff-*.dmg
            release/AI-Chief-of-Staff-*.zip
            release/AI-Chief-of-Staff-*-x64-setup.exe
            release/latest-mac.yml
            release/latest.yml
            release/SHA256SUMS-*.txt
            release/tester-rescue.ps1
          body: |
            ## AI Chief of Staff ${{ github.ref_name }}

            Trust-and-voice prerelease. Artifacts were built from this tag, passed the locked dependency, type, lint, test, native-module, signature, and checksum gates, and were manually promoted.

            ### Downloads
            - macOS Apple Silicon: `AI-Chief-of-Staff-*-arm64-mac.dmg`
            - macOS Intel: `AI-Chief-of-Staff-*-x64-mac.dmg`
            - Windows x64: `AI-Chief-of-Staff-*-x64-setup.exe`
